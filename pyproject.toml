[build-system]
requires = ["setuptools>=60"]
build-backend = "setuptools.build_meta"

[project]
name = "signallang"
version = "0.3.0"
description = "A small, safe scripting language for publishing synthetic signals - time-varying structured data, no eval/exec, no user-defined functions."
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.9"
authors = [{ name = "khiemgom" }]
keywords = ["dsl", "scripting-language", "synthetic-data", "pub-sub", "testing", "signal-generator", "ros2"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Interpreters",
    "Topic :: Software Development :: Testing",
    "Topic :: System :: Networking",
    "Typing :: Typed",
]
dependencies = []

[project.scripts]
signallang = "signallang.cli:main"

[project.urls]
Homepage = "https://github.com/KhiemGOM/signallang"
Repository = "https://github.com/KhiemGOM/signallang"
Issues = "https://github.com/KhiemGOM/signallang/issues"

[project.optional-dependencies]
test = ["pytest>=7", "hypothesis>=6"]
dev = ["mypy>=1.8", "ruff>=0.9", "build>=1"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
signallang = ["py.typed"]

[tool.mypy]
ignore_missing_imports = true
check_untyped_defs = true

[tool.ruff]
target-version = "py39"
line-length = 120
